schemaVersion: "0.1.0"
id: local_documents
name: Local Documents Demo
description: Read the sample lesson document from an explicitly configured workspace.
version: "0.1.0"
status: reviewed
adapter:
  type: file
  workspaceRoots:
    - examples/workspace
policy:
  defaultApproval: onRisk
  maxOutputBytes: 8192
  timeoutMs: 10000
tools:
  - name: read_lesson
    title: Read sample lesson
    description: Read the included Markdown lesson from the example workspace.
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
    risk:
      level: low
      readOnly: true
      destructive: false
      idempotent: true
      external: false
      requiresApproval: false
      dataSensitivity: public
    operation:
      type: fileRead
      path: lesson.md

  - name: search_lessons
    title: Search local lessons
    description: Search approved text files under the configured workspace for a phrase.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
        maxResults:
          type: integer
          minimum: 1
          maximum: 100
      required:
        - query
      additionalProperties: false
    risk:
      level: low
      readOnly: true
      destructive: false
      idempotent: true
      external: false
      requiresApproval: false
      dataSensitivity: internal
    operation:
      type: fileSearch
